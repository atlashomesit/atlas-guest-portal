<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Brand-neutral default; per-tenant favicons are applied at runtime by
       applyTenantBranding() (tenant.faviconUrl / TENANT_OVERRIDES[slug].faviconUrl). -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c04528" />
  <!-- CPO-watch #15: PWA manifest makes the guest portal installable on mobile + desktop.
       Tenant builds can swap this for a per-tenant manifest as the brand-extraction matures. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Atlastays" />
  <!-- TASK-7755: icons lived under /be/ until that orphaned CRA tree was deleted; keep them under /icons. -->
  <link rel="apple-touch-icon" href="/icons/logo192.png" />
  <link rel="canonical" href="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- TASK-7822: display=optional so desktop heading swap cannot contribute CLS.
       TASK-7839: this CSS is small; the FCP shell below paints without waiting for JS. -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=optional" rel="stylesheet" />
  <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin />
  <link rel="preconnect" href="https://atlashomestorage.blob.core.windows.net" crossorigin />
  <!-- TASK-1453: warm API + image CDN for first paint (same-origin /api still benefits on split deployments) -->
  <link rel="preconnect" href="https://api.atlaspms.in" crossorigin />
  <link rel="dns-prefetch" href="https://checkout.razorpay.com" />
  <link rel="dns-prefetch" href="https://atlashomestorage.blob.core.windows.net" />
  <link rel="dns-prefetch" href="https://imagedelivery.net" />
  <title>Atlastays — Book direct with verified hosts</title>
  <!-- Static fallback SEO meta tags — SEO.tsx overrides these per-page at runtime; TenantJsonLd.tsx injects tenant-aware JSON-LD -->
  <meta name="description" content="Book properties directly. Zero booking fees. Instant confirmation. Verified properties." />
  <meta property="og:title" content="Find your perfect stay" />
  <meta property="og:description" content="Browse our properties and book directly. Zero booking fees. Instant confirmation." />
  <!-- TASK-559: og-image.svg is a 1200×630 fallback; relative URL is tenant-safe (rewritten by SEO.tsx at runtime) -->
  <meta property="og:image" content="/og-image.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:url" content="" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Find your perfect stay" />
  <meta name="twitter:description" content="Browse properties and book directly with zero fees." />
  <meta name="twitter:image" content="/og-image.svg" />
</head>

<body>
  <!-- TASK-7839 / TASK-7822: inlined first-paint shell. Present in the HTML so FCP
       does not wait for the 49-chunk SPA. React replace()s #root when the app is
       ready. Shifting nodes identified from the live homepage (not guessed):
       the previous boot shell was a 2-column photo split, but `.ahv2-hero` is a
       single centered gradient column — that desktop-only mismatch is the CLS
       0.385 source (mobile already stacks to 1 column, CLS 0). Dimensions now
       match navbar 116px/80px, 1-col hero min(72vh,760px), widget slot, 4/3 cards. -->
  <style>
    :root { --boot-nav-height: 116px; --boot-ivory: #fefcf9; }
    @media (max-width: 760px) { :root { --boot-nav-height: 80px; } }
    html, body { margin: 0; background: var(--boot-ivory); }
    #root:not(:empty) { min-height: 100vh; }
    .boot-shell { font-family: Georgia, "Times New Roman", serif; color: #3b1f1e; }
    .boot-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      height: var(--boot-nav-height); background: var(--boot-ivory);
      border-bottom: 1px solid rgba(59, 31, 30, 0.08);
    }
    .boot-main { padding-top: var(--boot-nav-height); }
    .boot-hero {
      min-height: min(72vh, 760px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #fde0c8 0%, #f5c8b0 18%, #f0c0c0 35%, #e8c8e0 52%, #d8c0e8 72%, #ccc0ee 100%);
      padding: 84px 8% 48px; box-sizing: border-box; text-align: center;
    }
    .boot-kicker {
      height: 14px; width: 120px; background: #f5c8b0; border-radius: 4px; margin-bottom: 24px;
    }
    .boot-title {
      height: 64px; width: min(18ch, 80%); background: #f0c0c0; border-radius: 6px; margin-bottom: 16px;
    }
    .boot-title-2 { width: min(12ch, 55%); height: 48px; margin-bottom: 28px; }
    .boot-sub {
      height: 16px; width: min(52ch, 70%); background: #e8c8e0; border-radius: 4px; margin-bottom: 40px;
    }
    .boot-widget {
      width: min(100%, 900px); min-height: 144px; background: #fff; border-radius: 18px;
      box-shadow: 0 12px 60px rgba(59, 31, 30, 0.12);
    }
    .boot-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
      padding: 32px 8% 64px;
    }
    @media (max-width: 760px) { .boot-grid { grid-template-columns: 1fr; } }
    .boot-card { border-radius: 18px; overflow: hidden; background: #fff; }
    .boot-card-photo { aspect-ratio: 4 / 3; background: linear-gradient(140deg, #fde0c8 0%, #f5c8b0 55%, #ebb89a 100%); }
    .boot-card:nth-child(even) .boot-card-photo { background: linear-gradient(140deg, #e0d0f0 0%, #d8c0e8 55%, #c0a8d8 100%); }
    .boot-card-body { height: 88px; }
  </style>
  <div id="root">
    <div class="boot-shell" data-testid="boot-shell" role="status" aria-label="Loading stays">
      <div class="boot-nav" aria-hidden="true"></div>
      <div class="boot-main">
        <div class="boot-hero">
          <div class="boot-kicker"></div>
          <div class="boot-title"></div>
          <div class="boot-title boot-title-2"></div>
          <div class="boot-sub"></div>
          <div class="boot-widget" aria-hidden="true"></div>
        </div>
        <div class="boot-grid" aria-hidden="true">
          <div class="boot-card"><div class="boot-card-photo"></div><div class="boot-card-body"></div></div>
          <div class="boot-card"><div class="boot-card-photo"></div><div class="boot-card-body"></div></div>
          <div class="boot-card"><div class="boot-card-photo"></div><div class="boot-card-body"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- PWA: register SW after first paint (public/sw-register.js — identical in Vite + Pages). -->
  <script src="/sw-register.js" defer></script>
  <!-- JSON-LD blocks are injected at runtime by TenantJsonLd.tsx (RA-006/TASK-2335) -->
</body>

</html>
