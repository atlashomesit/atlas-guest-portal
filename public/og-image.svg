    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Atlas logo circle -->
  <circle cx="180" cy="200" r="56" fill="#FFFFFF" opacity="0.1"/>
  <text x="180" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700"
