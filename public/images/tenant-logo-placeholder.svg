<?xml version="1.0" encoding="UTF-8"?>
<!--
  RA-006 §3.6: Brand-neutral logo placeholder.
  Used as the bundled fallback when a tenant has not uploaded their own logo. Renders
  a generic house glyph in the tenant's brand color (via currentColor) so it adopts
  whatever theme is active without leaking Atlas-specific imagery.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Homestay">
  <title>Homestay</title>
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 30 L32 10 L56 30" />
    <path d="M14 28 V52 H50 V28" />
    <path d="M26 52 V36 H38 V52" />
    <path d="M44 14 V22" />
  </g>
</svg>
