# TASK-2733 — server-side author-email allowlist (docs/governance/feedback_author_email_allowlist.md in atlas-e2e).
# Durable defense against placeholder-identity commits (atlas@example.com class) that bypass client-side hooks.
# Founder-approved 2026-07-08 (interactive session). GHA-COST-APPROVED: 360
name: Author email allowlist

# Trigger scope: `pull_request` AND `push: [dev]`.
# HISTORY: `push` was removed 2026-07-20 on the premise that "nothing reaches dev except via PR".
# That premise was FALSE — HARD RULE 2 (MERGE-FAST) explicitly permits single-repo non-guardrail
# work to push dev DIRECT. On 2026-07-30 two contributors pushed straight to dev; six
# locally-authored `atlashomesit` commits across four repos were never checked because no PR
# existed, and one of those pushes also left dev unbuildable. Restored 2026-07-31 with founder
# approval, accepting the ~1 billed min/push (the 2026-07-20 saving assumed duplicate PR+push
# runs; for a direct push this run is the ONLY run, not a duplicate).
# GHA-COST-APPROVED: 360 (unchanged — same single job, one added step, no new job).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  author-allowlist:
    name: Author email allowlist
    runs-on: ubuntu-latest
    steps:
      # Unresolved merge-conflict markers. 2026-07-30: atlas-admin-portal dev shipped 28 literal
      # conflict blocks across 5 files (merge 5689cacf); `npm run build` died on `Unexpected "<<"`
      # and dev was unbuildable for ~4h for every consumer incl. the scheduled fleet. `git add -A`
      # after a conflict clears the unmerged flag WITHOUT removing the marker text, so git commits
      # it happily. Same job as the identity check by design: GitHub bills a 1-min minimum PER JOB,
      # so an extra step here is effectively free where a second job would not be.
      # Matches only `<<<<<<<` / `>>>>>>>` at line start — NOT a bare `=======`, which is a valid
      # Markdown setext H1 underline. Every real conflict carries all three, so the two unambiguous
      # markers are sufficient and the docs false-positive class is eliminated.
      - uses: actions/checkout@v4
      - name: Unresolved conflict markers
        run: |
          if git grep -nIE '^(<{7}|>{7})( |$)' -- . ':(exclude).github/workflows/*'; then
            echo ""
            echo "BLOCKED: unresolved merge-conflict markers present in tracked files (listed above)."
            echo "Resolve each block (keep the correct merged result, delete the <<<<<<< /"
            echo "======= / >>>>>>> lines), rebuild, and push again."
            exit 1
          fi
          echo "No unresolved conflict markers."
      - uses: actions/github-script@v7
        with:
          script: |
            // atlashomesit is the org-owner / PR-merge service account. Its role is
            // MERGING, never authoring: allowed on PRs into main (dev->main promotion
            // carries dev history incl. its merge commits) but denied on PRs into dev —
            // authored work must be attributable to a person (TASK-5348; 8
            // mis-attributed feature commits landed 2026-07-10..22 under it).
            // \d+\+atlashomesit covers its noreply form once email privacy is on.
            const ALLOW = /^(sreekaratla81|sreekar\.atla|noreply|150553417\+sreekaratla81|udaykumar\.ragipindi|sidharthyennawar|\d+\+atlashomesit)@.*$/;
            const SHARED_OWNER = /^atlashomesit@/;
            const baseRef = context.payload.pull_request?.base?.ref || '';
            let commits = [];
            if (context.eventName === 'pull_request') {
              commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
            } else {
              const before = context.payload.before;
              if (before && !/^0+$/.test(before)) {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${before}...${context.payload.after}`,
                });
                commits = cmp.data.commits;
              } else {
                commits = (context.payload.commits || []).map(c => ({
                  sha: c.id,
                  commit: { author: { email: c.author.email }, committer: { email: c.committer?.email || c.author.email } },
                }));
              }
            }
            const denied = [];
            for (const c of commits) {
              for (const who of ['author', 'committer']) {
                const email = c.commit?.[who]?.email || '';
                // GitHub's web-flow committer signs merge/squash commits made in the UI
                if (email === 'noreply@github.com') continue;
                if (SHARED_OWNER.test(email)) {
                  if (baseRef === 'main') continue; // dev->main promotion: merge-role sanctioned (founder 2026-07-24)
                  denied.push(`SHARED-ACCOUNT-DENIED: ${c.sha} ${who}=${email} — atlashomesit never authors; set your own git identity (atlas-e2e/docs/governance/COMMIT-IDENTITY.md)`);
                  continue;
                }
                if (!ALLOW.test(email)) denied.push(`AUTHOR-DENIED: ${c.sha} ${who}=${email}`);
              }
            }
            if (denied.length) {
              denied.forEach(d => core.error(d));
              core.setFailed(`${denied.length} commit identity violation(s). Fix git config user.email (see atlas-e2e/docs/governance/feedback_author_email_allowlist.md).`);
            } else {
              core.info(`All ${commits.length} commit identities allowlisted.`);
            }
