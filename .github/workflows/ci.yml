# Lint, build, test per DEVSECOPS-GATES-BASELINE.md. Status check name for branch protection: build
# Smoke/preview testing is handled by Cloudflare Pages preview deployments.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Doc-only PRs don't need lint/build/test/bundle-check. The job still
      # runs (so the required `build` check posts) but exits ~30s instead
      # of ~5 min when only markdown/static assets changed.
      - name: Determine PR scope
        id: scope
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          non_doc=$(git diff --name-only "$base" "$head" \
            | grep -vE '^(docs/|.+\.md$|.+\.svg$|.+\.png$|.+\.jpg$|public/sitemap\.xml$)' || true)
          if [ -z "$non_doc" ]; then
            echo "::notice::Doc-only PR — skipping lint/build/test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.skip != 'true'
        run: npm ci

      - name: Lint
        if: steps.scope.outputs.skip != 'true'
        run: npm run lint

      - name: Build
        if: steps.scope.outputs.skip != 'true'
        run: npm run build

      - name: Test
        if: steps.scope.outputs.skip != 'true'
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=14336
          CI: true

      - name: Check bundle for local network access APIs
        if: steps.scope.outputs.skip != 'true'
        run: npm run check:local-network
