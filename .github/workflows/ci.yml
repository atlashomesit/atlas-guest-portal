name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Validate legal content
        run: npm run validate:legal

      - name: Run booking form tests
        run: CI=1 node node_modules/vitest/vitest.mjs run tests/BookingFrom.test.tsx --runInBand --bail=1

      - name: Build
        run: npm run build

      - name: Check bundle for local network access APIs
        run: npm run check:local-network
