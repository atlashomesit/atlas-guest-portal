# TASK-7728 option 1 — server-side unit bar on PRs to dev.
#
# 2026-08-15 FOUNDER RULING — the test run is REMOVED. This job is now a no-op that only
# reports the `Unit bar` check so branch protection stays satisfied.
#
# WHY, so nobody "restores" this the way HARD RULE 19's ubuntu/windows note kept getting
# re-litigated: this workflow ran the FULL unit suite on every PR to dev, ~9 min per PR on
# atlas-api. Measured 2026-08-15: 9 PRs in one day = ~83 min on this workflow alone, ~119 min
# across all five repos. With the team onboarding 2026-08-17 that projects to ~477 min/day,
# ~10,500 min/month, against 2,000-3,000 included for private repos. The founder ruled the
# overage unaffordable and directed removal across all five repos.
#
# WHAT ENFORCES THE BAR NOW: the LOCAL unit bar only —
#   pwsh atlas-e2e/scripts/run-unit-bar.ps1 -Repo <repo>
# which builds + runs the full unit suite and mints a sha-keyed marker. The pre-push hook makes
# that marker UNCONDITIONAL for a direct push to refs/heads/dev.
#
# THE GAP THIS OPENS — KNOWN AND ACCEPTED, DO NOT REDISCOVER IT AS A BUG:
# feature-branch pushes are NOT gated by the pre-push hook (only refs/heads/dev is), and the
# marker is, in the hook's own words, "a client-side control either way (a marker is just a
# file)". So a PR from an author who never ran the local bar now has NO enforced bar at all.
# That is a deliberate cost tradeoff, not an oversight.
#
# WHY THE JOB STILL EXISTS INSTEAD OF BEING DELETED: `Unit bar` is a REQUIRED status check on
# `dev` in all five repos. Deleting the workflow would leave that check permanently pending and
# every PR blocked forever. Branch protection is immutable (HARD RULE 17), so the check must
# keep reporting. Cost is now runner spin-up only (~5s) instead of ~9 min.
#
# TO RESTORE: `git revert` this commit. Do not hand-rewrite it — the original ran
# `dotnet test`/`npm test` per repo and the details differ.
#
# GHA-COST-APPROVED: 5
name: Unit tests (PR to dev)

on:
  pull_request:
    # TASK-8449: was missing 'reopened' -- the only one of the five train repos without it
    # (atlas-api/atlas-admin-portal/atlas-pms-landing/atlas-e2e all already have it). Per
    # assert-pr-unit-test-dev-workflow.ps1's own contract (opened/synchronize/reopened -- the
    # recovery path), a PR closed-then-reopened here never re-triggers the required "Unit bar"
    # check, leaving branch protection unable to resolve it without a fresh synchronize push.
    types: [opened, synchronize, reopened]
    branches: [dev]

concurrency:
  group: pr-unit-test-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-bar:
    name: Unit bar
    runs-on: ubuntu-latest
    steps:
      - name: Unit bar is enforced locally, not in CI
        run: |
          echo "Server-side unit tests removed 2026-08-15 (founder ruling: GHA cost)."
          echo "The bar is the LOCAL unit bar: run-unit-bar.ps1 -Repo <repo>, which mints the"
          echo "sha-keyed unit-pass marker the pre-push hook requires for pushes to dev."
          echo "This job exists only so the required 'Unit bar' check keeps reporting."
