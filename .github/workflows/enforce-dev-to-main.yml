name: Enforce qa → main

# Workspace policy: every commit reaching main MUST come from the `qa` release branch.
# This workflow fails any PR to main whose head branch is not `qa`.
# Non-negotiable per founder decision 2026-05-14; narrowed dev -> qa by the release train.
#
# Trigger scope: `opened` + `reopened` only — the head branch of an open PR
# cannot change without closing + reopening, so re-validating on every
# `synchronize` (default) is pure waste. The trim cut billed GHA minutes
# ~95% on 2026-05-23 (was ~1,600 min/mo across 5 repos, now ~50).
# Do NOT add `synchronize` back without a cost review.
#
# ── RENAMED (2026-10-17, founder-directed, TASK-10298711) ─────────────────────────
# The required check on main used to be named "PR source must be dev", which was
# misleading: this gate REJECTS dev and accepts ONLY qa. Phase 1 (2026-08-15) published
# both names; on 2026-10-17 the founder switched main's required check to
# "PR source must be qa" on all five repos, and the legacy job was deleted here.
# The job name IS the required status-check context and `enforce_admins` is on, so
# renaming this job again deadlocks every promotion unless protection changes first.
# ─────────────────────────────────────────────────────────────────────────────────
#
# GHA-COST-APPROVED: 1

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-source-qa:
    # REQUIRED CONTEXT on main (with "Pre-prod GO"). Do not rename without first
    # changing main's branch protection; see the header.
    name: PR source must be qa
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR head_ref == qa
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$HEAD_REF" != "qa" ]; then
            echo "::error title=Branch policy violation::PR #${PR_NUMBER} targets main from '${HEAD_REF}', but workspace policy requires every PR to main come from the release branch 'qa'. Nothing reaches prod without passing STEP 9 on a frozen qa SHA. Land your change on dev (unit + integration bar), let the daily qa cut carry it — or cherry-pick it to qa if it cannot wait — then promote qa → main."
            exit 1
          fi
          echo "PR head is '${HEAD_REF}' — branch policy satisfied."
