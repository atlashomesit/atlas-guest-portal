name: Enforce dev → main

# Workspace policy: every commit reaching main MUST first land on dev.
# This workflow fails any PR to main whose head branch is not `dev`.
# Canonical policy: ../../POLICY-BRANCH-AND-DEPLOY.md (workspace root).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-source:
    name: PR source must be dev
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR head_ref == dev
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error title=Branch policy violation::PR #${PR_NUMBER} targets main from '${HEAD_REF}', but workspace policy requires PRs to main come from 'dev'. Land your changes on dev first, then open a dev → main PR."
            echo "Policy: every commit on main must first exist on dev. See POLICY-BRANCH-AND-DEPLOY.md."
            exit 1
          fi
          echo "✓ PR head is 'dev' — branch policy satisfied."
