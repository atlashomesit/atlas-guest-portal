name: Enforce dev → main

# Workspace policy: every commit reaching main MUST first land on dev.
# This workflow fails any PR to main whose head branch is not `dev`.
# Non-negotiable per founder decision 2026-05-14.
#
# Trigger scope: `opened` + `reopened` only — the head branch of an open PR
# cannot change without closing + reopening, so re-validating on every
# `synchronize` (default) is pure waste. The trim cut billed GHA minutes
# ~95% on 2026-05-23 (was ~1,600 min/mo across 5 repos, now ~50).
# Do NOT add `synchronize` back without a cost review.

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-source:
    # DO NOT RENAME. "PR source must be dev" is the required status-check name configured in
    # branch protection on main. Renaming the job means the required check never reports and
    # every PR to main hangs forever waiting for a status that can no longer arrive. The qa
    # release train (2026-08-08) widened the ACCEPTED head refs to dev + qa; the check NAME is
    # load-bearing and deliberately stays as-is.
    name: PR source must be dev
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR head_ref == dev
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$HEAD_REF" != "qa" ]; then
            echo "::error title=Branch policy violation::PR #${PR_NUMBER} targets main from '${HEAD_REF}', but workspace policy requires every PR to main come from the release branch 'qa'. Nothing reaches prod without passing STEP 9 on a frozen qa SHA. Land your change on dev (unit + integration bar), let the daily qa cut carry it — or cherry-pick it to qa if it cannot wait — then promote qa → main."
            exit 1
          fi
          echo "PR head is '${HEAD_REF}' — branch policy satisfied."
