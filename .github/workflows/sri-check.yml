# SRI integrity check for externally-loaded scripts and stylesheets.
#
# Any <script src> or <link rel="stylesheet" href> pointing to an external CDN
# domain (fonts.googleapis.com, cdnjs.cloudflare.com, unpkg.com, jsdelivr.net,
# etc.) MUST carry both integrity="sha384-..." and crossorigin="anonymous".
# Without SRI, a compromised CDN can silently inject arbitrary JavaScript or CSS
# into the guest-facing portal, constituting a supply-chain attack on guests'
# payment flows.
#
# Trigger: every push to dev (fast feedback) + workflow_dispatch for ad-hoc audits.
# No PR gate: the build CI job already gates PRs; this adds a separate push check
# so SRI regressions are caught before they accumulate over multiple merges.
#
# Implementation: an inline Node.js script parses every HTML file under the repo
# (including build output in dist/ or public/) using regex, collects all external
# resource tags, and fails if any tag is missing integrity= or crossorigin=.
# Node.js regex is used intentionally (no htmlparser2 dependency) — sufficient for
# the static patterns produced by Vite/CRA builds.
#
# Step summary: always written, even on success, so the check is auditable in the
# GitHub Actions "Summary" tab without needing to drill into logs.
name: SRI integrity check

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sri-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Check SRI on external resources
        id: sri
        shell: bash
        run: |
          node - << 'EOF'
          /**
           * SRI checker — inline Node.js script (no external deps).
           *
           * Walks the repository looking for *.html files, then inspects every
           * <script src="..."> and <link rel="stylesheet" href="..."> tag.
           * A tag is "external" if its src/href begins with https:// or http://
           * and its hostname is NOT the portal's own origin (relative paths and
           * same-origin absolute URLs are exempt).
           *
           * Own-origin exemptions: localhost, *.atlashomestays.com,
           * *.starguesthouse.com, *.atlaspms.in, Cloudflare Pages preview URLs,
           * and Azure blob storage / app service URLs used for images/APIs.
           *
           * For each external tag the checker verifies:
           *   1. integrity attribute is present and matches /^sha(256|384|512)-/
           *   2. crossorigin attribute equals "anonymous"
           *
           * Exit codes: 0 = all tags compliant, 1 = violations found.
           */
          const fs   = require('fs');
          const path = require('path');

          // --- Own-origin allow-list (these are NOT treated as external CDNs) ---
          const OWN_ORIGIN_PATTERNS = [
            /^https?:\/\/localhost(:\d+)?/,
            /^https?:\/\/[^/]*\.atlashomestays\.com/,
            /^https?:\/\/[^/]*\.starguesthouse\.com/,
            /^https?:\/\/[^/]*\.atlaspms\.in/,
            /^https?:\/\/[^/]*\.pages\.dev/,          // Cloudflare Pages previews
            /^https?:\/\/[^/]*\.azurewebsites\.net/,  // Azure App Service
            /^https?:\/\/[^/]*\.blob\.core\.windows\.net/, // Azure Blob
            /^https?:\/\/checkout\.razorpay\.com/,    // Razorpay checkout (SRI not supported by them)
            /^https?:\/\/api\.razorpay\.com/,
            /^https?:\/\/imagedelivery\.net/,         // Cloudflare Images
          ];

          // --- Directories to skip ---
          const SKIP_DIRS = new Set(['node_modules', '.git', '.github']);

          function isOwnOrigin(url) {
            return OWN_ORIGIN_PATTERNS.some(re => re.test(url));
          }

          function isExternalUrl(url) {
            return /^https?:\/\//i.test(url) && !isOwnOrigin(url);
          }

          function collectHtmlFiles(dir, results = []) {
            let entries;
            try { entries = fs.readdirSync(dir, { withFileTypes: true }); }
            catch { return results; }
            for (const entry of entries) {
              if (SKIP_DIRS.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                collectHtmlFiles(full, results);
              } else if (entry.isFile() && entry.name.endsWith('.html')) {
                results.push(full);
              }
            }
            return results;
          }

          // Regex patterns to extract tags — intentionally permissive to catch
          // any variant of whitespace / attribute ordering produced by build tools.
          // We match the full opening tag so we can inspect all attributes at once.
          const SCRIPT_TAG_RE = /<script\b([^>]*)>/gi;
          const LINK_TAG_RE   = /<link\b([^>]*)>/gi;

          function attrVal(attrs, name) {
            const m = new RegExp(`\\b${name}\\s*=\\s*(?:"([^"]*)"|'([^']*)'|(\\S+))`, 'i').exec(attrs);
            return m ? (m[1] ?? m[2] ?? m[3] ?? '') : null;
          }

          function hasAttr(attrs, name) {
            return new RegExp(`\\b${name}\\b`, 'i').test(attrs);
          }

          const violations  = [];
          const checked     = [];
          const repoRoot    = process.cwd();
          const htmlFiles   = collectHtmlFiles(repoRoot);

          for (const file of htmlFiles) {
            const relPath = path.relative(repoRoot, file);
            const html    = fs.readFileSync(file, 'utf8');

            // Check <script src="...">
            let m;
            SCRIPT_TAG_RE.lastIndex = 0;
            while ((m = SCRIPT_TAG_RE.exec(html)) !== null) {
              const attrs = m[1];
              const src   = attrVal(attrs, 'src');
              if (!src || !isExternalUrl(src)) continue;
              const tag = { file: relPath, type: 'script', url: src };
              checked.push(tag);
              const integrity   = attrVal(attrs, 'integrity');
              const crossorigin = attrVal(attrs, 'crossorigin');
              const integrityOk   = integrity && /^sha(256|384|512)-/.test(integrity);
              const crossoriginOk = crossorigin === 'anonymous';
              if (!integrityOk || !crossoriginOk) {
                violations.push({
                  ...tag,
                  missing: [
                    ...(integrityOk   ? [] : ['integrity']),
                    ...(crossoriginOk ? [] : ['crossorigin="anonymous"']),
                  ],
                });
              }
            }

            // Check <link rel="stylesheet" href="...">
            LINK_TAG_RE.lastIndex = 0;
            while ((m = LINK_TAG_RE.exec(html)) !== null) {
              const attrs = m[1];
              const rel   = attrVal(attrs, 'rel');
              if (!rel || rel.toLowerCase() !== 'stylesheet') continue;
              const href = attrVal(attrs, 'href');
              if (!href || !isExternalUrl(href)) continue;
              const tag = { file: relPath, type: 'link[stylesheet]', url: href };
              checked.push(tag);
              const integrity   = attrVal(attrs, 'integrity');
              const crossorigin = attrVal(attrs, 'crossorigin');
              const integrityOk   = integrity && /^sha(256|384|512)-/.test(integrity);
              const crossoriginOk = crossorigin === 'anonymous';
              if (!integrityOk || !crossoriginOk) {
                violations.push({
                  ...tag,
                  missing: [
                    ...(integrityOk   ? [] : ['integrity']),
                    ...(crossoriginOk ? [] : ['crossorigin="anonymous"']),
                  ],
                });
              }
            }
          }

          // --- Write GitHub Step Summary ---
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;
          const lines = [];
          lines.push('## SRI integrity check');
          lines.push('');
          lines.push(`- HTML files scanned: **${htmlFiles.length}**`);
          lines.push(`- External resource tags checked: **${checked.length}**`);
          lines.push(`- Violations: **${violations.length}**`);
          lines.push('');

          if (violations.length > 0) {
            lines.push('### Violations');
            lines.push('');
            lines.push('| File | Type | URL | Missing attributes |');
            lines.push('|------|------|-----|--------------------|');
            for (const v of violations) {
              lines.push(`| \`${v.file}\` | ${v.type} | \`${v.url}\` | ${v.missing.join(', ')} |`);
            }
            lines.push('');
            lines.push('> Each external CDN resource must have `integrity="sha384-..."` and `crossorigin="anonymous"`.');
            lines.push('> Generate hashes with: `openssl dgst -sha384 -binary <file> | openssl base64 -A`');
            lines.push('> Or use the [SRI Hash Generator](https://www.srihash.org/).');
          } else {
            lines.push('All external resource tags carry valid SRI attributes.');
          }

          if (summaryFile) {
            fs.appendFileSync(summaryFile, lines.join('\n') + '\n');
          }

          // --- Console output ---
          console.log(`SRI check: ${htmlFiles.length} HTML files, ${checked.length} external tags, ${violations.length} violations`);
          if (violations.length > 0) {
            console.error('\nSRI violations found:\n');
            for (const v of violations) {
              console.error(`  [${v.type}] ${v.file}`);
              console.error(`    URL: ${v.url}`);
              console.error(`    Missing: ${v.missing.join(', ')}`);
            }
            console.error('\nAll external CDN resources must declare integrity="sha384-..." and crossorigin="anonymous".');
            console.error('See: https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity');
            process.exit(1);
          } else {
            console.log('All external resource tags are SRI-compliant.');
          }
          EOF
