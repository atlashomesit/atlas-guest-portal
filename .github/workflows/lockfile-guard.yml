# Status check name for branch protection: lockfile-guard
name: Lockfile guard
on:
  pull_request:

permissions:
  contents: read   # needed for actions/checkout
  statuses: write  # needed to post lockfile-guard commit status

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: 'npm'
      - run: npm ci
      - run: git status --porcelain | (! grep -E 'package-lock.json')
      - name: Report lockfile-guard commit status
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: ok ? 'success' : 'failure',
              context: 'lockfile-guard',
              description: ok ? 'Lockfile is clean' : 'Lockfile drift detected',
            });
