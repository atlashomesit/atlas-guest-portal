name: Enforce merge-commit on main

# Workspace policy: every commit reaching main MUST be a 2-parent merge commit
# (i.e. PR merged via "Create a merge commit", NOT "Rebase and merge" or "Squash").
# This workflow fails the run if the tip of main (the newly pushed commit) is not
# a merge commit. GitHub's API forbids disabling rebase AND squash at the same time,
# so the merge-method allow flags can't enforce this on their own — this workflow
# is the post-fact detection.
#
# Filed 2026-05-22 by founder (Sreekar) request for true merge-commit-only enforcement.
# See atlas-e2e/docs/governance/PR-MERGE-STRATEGY.md for the full rule.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-merge-commit:
    name: HEAD on main must be a merge commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the pushed tip is a merge commit
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -e

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First-ever push to this branch (branch creation). No prior history to walk.
            echo "Branch creation push — verifying HEAD only."
            TIP="$AFTER"
          else
            # Validate only the newly pushed tip ($AFTER), not all intermediate commits.
            TIP="$AFTER"
          fi

          if [ -z "$TIP" ]; then
            echo "No commit to verify (empty tip). OK."
            exit 0
          fi

          PARENT_COUNT=$(git cat-file -p "$TIP" | grep -c '^parent ' || true)
          if [ "$PARENT_COUNT" -ne 2 ]; then
            SUBJECT=$(git log -1 --format='%s' "$TIP")
            AUTHOR=$(git log -1 --format='%an <%ae>' "$TIP")
            echo "::error title=Merge-commit policy violation::Commit $TIP on main has $PARENT_COUNT parent(s); expected 2 (merge commit). Author: $AUTHOR. Subject: $SUBJECT. This PR was merged with 'Rebase and merge' or 'Squash and merge' — both forbidden by PR-MERGE-STRATEGY.md. Recovery: revert the bad merge on main, then re-merge the source PR via 'Create a merge commit'."
            exit 1
          fi

          echo "OK: $TIP is a merge commit (2 parents). Policy satisfied."
