# Gitleaks secret scanning — PR diff (via gitleaks-action) + full history on schedule.
# Not a required status check yet (run ~1 week to flush false positives, then branch protection).
#
# Org-owned repositories: add repo secret GITLEAKS_LICENSE from https://gitleaks.io (not required for personal accounts).
name: Secret scan

on:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Remediation hint
        if: failure()
        run: echo '::error::SECRET DETECTED. Rotate the leaked credential immediately, then add the file to .gitleaks.toml allowlist if it is a false positive. See docs/security/secret-rotation.md.'
