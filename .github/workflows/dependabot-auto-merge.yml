# Auto-merge Dependabot PRs that are patch-level only and have green CI.
# Policy:
#   - patch updates → auto-merge (squash) once required checks pass
#   - minor updates → leave for human review (dependency updates can break runtime behaviour)
#   - major updates → always human review
#
# Branch protection still gates the merge: this workflow only enables
# `--auto`, GitHub waits for required status checks before merging.
name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
